{% extends 'base.html' %}

{% block title %}Passenger Login — Namma Sarthi{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon">🚍</span>
            <h2 data-i18n="passenger_login_title">Passenger Login</h2>
            <p data-i18n="nav_passenger">Access live bus tracking portal</p>
        </div>

        <form method="POST" action="{% url 'user_login' %}" class="auth-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="phone" data-i18n="phone_label">Phone Number</label>
                <input type="tel" id="phone" name="phone" class="form-control" placeholder="Enter registered phone number" required>
            </div>

            <div class="form-group">
                <label for="password" data-i18n="password_label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block" data-i18n="btn_login">LOGIN</button>
        </form>

        <div class="auth-footer">
            <p><span data-i18n="no_account">New passenger?</span> <a href="{% url 'user_register' %}" data-i18n="link_register">Register here</a></p>
        </div>
    </div>
</div>
{% endblock %}
